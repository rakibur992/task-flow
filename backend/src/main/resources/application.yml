server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false

jwt:
  # Override JWT_SECRET in production via env var - this default is for local dev only
  secret: ${JWT_SECRET:dev-only-secret-change-me-before-anything-real-taskflow-2026}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
